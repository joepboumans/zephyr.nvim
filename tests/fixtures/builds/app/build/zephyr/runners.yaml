# Available runners configured by board.cmake.
runners:
- nrfjprog
- nrfutil
- jlink
- pyocd
- openocd

# Default flash runner if --runner is not given.
flash-runner: nrfjprog
# Default debug runner if --runner is not given.
debug-runner: jlink

# Common runner configuration values.
config:
  board_dir: /ws/zephyr/boards/nordic/nrf52840dk
  # Build outputs:
  elf_file: zephyr.elf
  hex_file: zephyr.hex
  bin_file: zephyr.bin
  # Host tools:
  gdb: /opt/zephyr-sdk/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb

# Runner specific arguments
args:
  nrfjprog:
    []
  nrfutil:
    - --ext-mem-config-file=/ws/zephyr/boards/nordic/nrf52840dk/support/nrf52840dk_qspi_nrfutil_config.json
  jlink:
    - --dt-flash=y
    - --device=nRF52840_xxAA
    - --speed=4000
